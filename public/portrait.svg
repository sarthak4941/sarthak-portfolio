<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0c16" />
      <stop offset="50%" stop-color="#06070a" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>

    <!-- Cyan Rim Light Gradient -->
    <linearGradient id="rimCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Violet Fill Light Gradient -->
    <linearGradient id="rimViolet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="300" r="280" fill="#00F0FF" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="450" r="260" fill="#A855F7" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Abstract Geometric Tech Circles behind head -->
  <circle cx="400" cy="420" r="220" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="400" cy="420" r="250" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="400" cy="420" r="280" stroke="#A855F7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="12 8" />

  <!-- Developer Silhouette / Torso -->
  <g id="portrait-figure">
    <!-- Shoulders and Coat Silhouette -->
    <path d="M160 880 C 180 720, 260 620, 340 590 L 460 590 C 540 620, 620 720, 640 880 Z" fill="#111322" />
    <path d="M160 880 C 180 720, 260 620, 340 590 L 460 590 C 540 620, 620 720, 640 880 Z" stroke="url(#rimCyan)" stroke-width="2" fill="none" />

    <!-- Inner Collar -->
    <path d="M330 600 L 400 700 L 470 600 Z" fill="#0a0b14" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

    <!-- Neck -->
    <path d="M360 480 L 440 480 L 440 600 L 360 600 Z" fill="#17192b" />
    <path d="M360 500 L 360 590" stroke="url(#rimCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M440 500 L 440 590" stroke="url(#rimViolet)" stroke-width="3" stroke-linecap="round" />

    <!-- Head / Jaw Silhouette -->
    <path d="M320 380 C 320 270, 480 270, 480 380 C 480 470, 430 520, 400 520 C 370 520, 320 470, 320 380 Z" fill="#1c1f36" />
    
    <!-- Face Rim Lights -->
    <!-- Left Jaw / Cheek (Cyan Rim) -->
    <path d="M320 340 C 315 410, 345 480, 390 515" stroke="url(#rimCyan)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Right Jaw / Cheek (Violet Rim) -->
    <path d="M480 340 C 485 410, 455 480, 410 515" stroke="url(#rimViolet)" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Sleek Modern Hair Silhouette -->
    <path d="M310 340 C 300 280, 330 220, 400 215 C 470 215, 500 260, 490 320 C 465 290, 420 295, 380 295 C 345 295, 325 315, 310 340 Z" fill="#0f111e" />
    <path d="M310 330 C 315 250, 360 215, 410 215 C 470 215, 490 260, 485 320" stroke="url(#rimCyan)" stroke-width="2.5" fill="none" />

    <!-- Stylized Eye-line Cyber Visor / Glasses Accent -->
    <path d="M345 385 L 455 385" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#glow)" />
    <circle cx="365" cy="385" r="3" fill="#00F0FF" filter="url(#glow)" />
    <circle cx="435" cy="385" r="3" fill="#A855F7" filter="url(#glow)" />
  </g>

  <!-- Telemetry Overlay Lines & Coordinates -->
  <line x1="80" y1="120" x2="220" y2="120" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="80" y="105" fill="#00F0FF" font-family="monospace" font-size="14" letter-spacing="4">SYS // IDENT_VERIFIED</text>
  <text x="80" y="145" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">DEV_ID: SP.CORE-2026</text>

  <!-- Bottom Vignette -->
  <rect y="700" width="800" height="300" fill="url(#bgGrad)" opacity="0.85" />

  <!-- Golden / Cyber Ratio Frame Accent -->
  <rect x="40" y="40" width="720" height="920" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <rect x="50" y="50" width="700" height="900" rx="16" stroke="rgba(0,240,255,0.15)" stroke-width="1" stroke-dasharray="8 12" />
</svg>
